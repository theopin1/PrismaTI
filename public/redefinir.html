<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova senha · PrismaTI</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page" data-page="redefinir">
<div class="auth-shell">
  <section class="auth-left">
    <div class="auth-inner">
      <a class="auth-brand" href="/"><img src="/img/logo.svg" width="30" height="30" alt=""> <span>Prisma<b>TI</b></span></a>
      <span class="auth-eyebrow">Segurança da conta</span>
      <h1>Criar nova<br><span>senha</span></h1>
      <p class="auth-sub">O link é válido por tempo limitado e pode ser usado uma única vez.</p>
      <form id="form" novalidate>
        <div class="field">
          <label for="password">Nova senha</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" required>
            <button type="button" class="pw-eye" data-toggle-pw="password" aria-label="Mostrar ou ocultar senha"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <div class="hint">Mínimo de 10 caracteres, com letras maiúsculas, minúsculas e números.</div>
        </div>
        <div class="field">
          <label for="password2">Confirme a senha</label>
          <div class="pw-wrap">
            <input id="password2" name="password2" type="password" autocomplete="new-password" required>
            <button type="button" class="pw-eye" data-toggle-pw="password2" aria-label="Mostrar ou ocultar confirmação"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="alert"></div>
        <button class="auth-submit" type="submit">
          <span>Salvar nova senha</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <div class="auth-foot-links">
        <a href="/entrar.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Voltar para o login</a>
      </div>
    </div>
  </section>
  <aside class="auth-right" aria-hidden="true">
    <div class="auth-ring r1"></div>
    <div class="auth-ring r2"></div>
    <div class="auth-glass g1"></div>
    <div class="auth-glass g2"></div>
    <div class="auth-prism-box">
      <img class="auth-prism-img" src="/img/login-prism.svg" alt="">
      <div class="auth-caption">Inteligência para<strong>evoluir sua TI.</strong></div>
    </div>
  </aside>
</div>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
