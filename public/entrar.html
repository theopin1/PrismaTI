<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · PrismaTI</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page" data-page="entrar">
<div class="auth-shell">
  <section class="auth-left">
    <div class="auth-inner">
      <a class="auth-brand" href="/"><img src="/img/logo.svg" width="30" height="30" alt=""> <span>Prisma<b>TI</b></span></a>
      <span class="auth-eyebrow">Acesso à plataforma</span>
      <h1>Bem-vindo ao<br><span>PrismaTI</span></h1>
      <p class="auth-sub">Acesse sua conta para iniciar seu diagnóstico.</p>
      <form id="form" novalidate>
        <div class="ok-box" id="ok"></div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="voce@empresa.com.br" required>
        </div>
        <div class="field">
          <div class="pw-label-row">
            <label for="password">Senha</label>
            <a href="/esqueci.html">Esqueceu sua senha?</a>
          </div>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
            <button type="button" class="pw-eye" data-toggle-pw="password" aria-label="Mostrar ou ocultar senha">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field" id="mfa-field" hidden>
          <label for="mfa_code">Código de verificação (aplicativo autenticador)</label>
          <input id="mfa_code" name="mfa_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
        </div>
        <div class="alert"></div>
        <button class="auth-submit" type="submit">
          <span>Entrar</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <div class="auth-foot-links">
        <a href="/"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Voltar para o início</a>
        <a href="/privacidade.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6l-7-3Z"/></svg> Privacidade e uso de dados</a>
      </div>
    </div>
  </section>
  <aside class="auth-right" aria-hidden="true">
    <div class="auth-ring r1"></div>
    <div class="auth-ring r2"></div>
    <div class="auth-glass g1"></div>
    <div class="auth-glass g2"></div>
    <div class="auth-prism-box">
      <img class="auth-prism-img" src="/img/login-prism.svg" alt="">
      <div class="auth-caption">Inteligência para<strong>evoluir sua TI.</strong></div>
    </div>
  </aside>
</div>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
